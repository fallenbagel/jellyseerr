# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Duplicate Issue Detector

on:
  issues:
    types: [opened]

permissions: {}

env:
  EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
  GROQ_MODEL: ${{ vars.GROQ_MODEL }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  detect-duplicate:
    runs-on: ubuntu-24.04
    if: ${{ !github.event.issue.pull_request }}
    permissions:
      issues: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - parallel:
          - name: Pnpm Setup
            uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

          - name: Set up Node.js
            uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
            with:
              node-version-file: 'package.json'

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: bin/duplicate-detector
        env:
          CI: true
        run: pnpm install --frozen-lockfile

      - name: Get latest successful run id
        id: get-latest-run-id
        run: |
          RUN_ID=$(gh api \
            /repos/${{ github.repository }}/actions/workflows/rebuild-issue-index.yml/runs \
            --jq '[.workflow_runs[] | select(.status=="completed" and .conclusion=="success")][0].id // empty')
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact
        if: steps.get-latest-run-id.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: issue-index
          path: bin/duplicate-detector
          run-id: ${{ steps.get-latest-run-id.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build index if missing
        working-directory: bin/duplicate-detector
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          INDEX_PATH: issue_index.json
        run: |
          if [ ! -f issue_index.json ]; then
            echo "No index found — building from scratch..."
            node build-index.mjs
          fi

      - name: Detect duplicates
        working-directory: bin/duplicate-detector
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          INDEX_PATH: issue_index.json
        run: node detect.mjs
